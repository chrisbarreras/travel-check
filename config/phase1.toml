# Phase 1 showcase data pipeline: pinned configuration.
# Schema: specs/002-showcase-data-pipeline/contracts/config.md (extends specs/001 contracts/config.md).
# Same pinned sources as Phase 0 (config/phase0.toml, frozen at the git tag phase0-final).
# Every value is required; there are no hidden defaults.

seed = 20261124

[paths]
# Relative paths resolve against the repository root (the parent of this file's directory).
raw_dir = "data/raw"
derived_dir = "data/derived/phase1"
reports_dir = "reports/phase1"

[period]
# One period for every source (amendment 1, research R11): 12 months in whole quarters.
start = "2024-07"                 # inclusive, YYYY-MM
end   = "2025-06"

[sources.ontime]
url_pattern = "https://www.transtats.bts.gov/PREZIP/On_Time_Marketing_Carrier_On_Time_Performance_Beginning_January_2018_{year}_{month}.zip"
overrides = {}                    # "YYYY-MM" = "full URL" for irregular file names

