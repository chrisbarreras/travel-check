[sources.t100]
manual_file = "data/raw/t100/t100_segment.csv"   # used when scripted download fails
checksum = "35fc4d07c70740e6c7369602a6f5668118fa2605e3df9ec9f1d6928b55e4af1f"  # sha256 of the combined CSV (2024-07 to 2025-06)

[timezones]
# "IATA" = { tz = "America/...", source = "..." } for airports missing from airportsdata
overrides = { PBI = { tz = "America/New_York", source = "Palm Beach International (KPBI), West Palm Beach, Florida: US Eastern time; absent from airportsdata 20261123" } }

[hubs]
candidate_pool_size = 30
airline_share_min = 0.05
eligible_itineraries_min = 15
weights = { airlines = 1.0, departures = 1.0, passengers = 1.0 }
count = 7                         # allowed 5–8
major_networks = ["AA", "DL", "UA", "WN", "AS"]
winter_months = [12, 1, 2]
spring_months = [3, 4, 5]
summer_months = [6, 7, 8]
autumn_months = [9, 10, 11]
min_winter_peak = 2
min_summer_peak = 2

[itineraries]
identity = "schedule"              # ADR-0014: schedule slots, not flight numbers
slot_window_min = 30              # departure-time window of a schedule slot
min_connection_default_min = 30
min_connection_partner_min = 45
min_connection_by_hub = {}        # "IATA" = minutes
max_layover_min = 240
recurrence_threshold = 0.60       # connection-level: share of days the two flights connect
partners = [["AA", "AS"]]
min_sold_passengers = 30          # sampled DB1B passengers on the routing over the period
carrier_map = {}                  # DB1B selling-airline code -> on-time marketing code

[feasibility]
boarding_cutoff_min = 15
min_sample_days = 30

[selection]
od_pairs_count = 15               # allowed 10–15
regional_share_min = 0.5
max_pairs_per_hub = 3

[comparison]
travel_time_tolerance_min = 60
departure_window_min = 180
showcase_gap = 0.10
ci_level = 0.95
bootstrap_resamples = 10000
go_min_examples = 3
go_min_hubs = 2

[sensitivity]
min_connection_min = [20, 30, 45]
boarding_cutoff_min = [10, 15, 20]
recurrence_threshold = [0.50, 0.60, 0.75]

[quality]
clock_mismatch_max_share = 0.01   # fail the run above this share

[runtime]
limit_min = 30                    # SC-008; `run` warns and records `runtime_exceeded` above this

[showcase]
routes_min = 8
routes_max = 12
itineraries_per_route_max = 12
max_share_route = 0.333           # of showcase comparisons
max_share_airline = 0.5
max_share_hub = 0.5
regional_share_min = 0.5          # of selected routes, when enough exist
cross_hub_share_min = 0.5         # of showcase comparisons (SC-002)
size_budget_kb = 2048             # gzip-compressed published files
landing_budget_kb = 150           # gzip-compressed index.json + landing.json (SC-007 proxy)
output_dir = "site-data/showcase"
tight_day_share_max = 0.1         # tight if > 10% of connecting days scheduled below the threshold

[insights]
faster_min_saving_min = 15
faster_margin = 0.02              # lower bound of the paired 95% CI no worse than -2 points
faster_departure_window_min = 180
buffer_share = 0.95
buffer_round_min = 5
monthly_min_sample = 20
schedule_change_min_shift_min = 10
schedule_change_min_days = 7

[notes]
disruption_file = "config/disruption_notes.toml"
